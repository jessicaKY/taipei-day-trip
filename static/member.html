<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>會員中心｜台北一日遊</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/css/navigation.css?v=1.0.10" />
    <link rel="stylesheet" href="/static/css/member.css?v=1.1.0" />
    <link rel="stylesheet" href="/static/css/auth.css?v=1.0.0" />
    <script src="/static/js/auth.js?v=1.1.0" defer></script>
    <script src="/static/js/navigation-booking.js?v=1.0.0" defer></script>
    <script src="/static/js/member.js?v=1.3.0" defer></script>
  </head>
  <body>
    <header class="site-header">
      <nav class="navigation" aria-label="主要導覽">
        <a class="brand" href="/">台北一日遊</a>
        <div class="navigation__links">
          <a href="/booking">預定行程</a>
          <button class="navigation__member" type="button">登入/註冊</button>
        </div>
      </nav>
    </header>

    <main class="member-page">
      <h1 class="member-greeting">您好，<strong id="member-name">旅客</strong>：</h1>
      <hr />

      <section class="member-orders" aria-labelledby="orders-title">
        <h2 id="orders-title">已完成的行程</h2>
        <p class="member-orders__status" id="member-orders-status" role="status">訂單讀取中...</p>
        <div class="member-orders__list" id="member-orders-list"></div>
      </section>

      <hr />

      <section class="member-integration" aria-labelledby="integration-title">
        <h2 id="integration-title">AI 工具整合</h2>
        <p>MCP 伺服器設定：</p>
        <ul>
          <li>
            <strong>Host URL</strong>
            <output id="mcp-host-url" aria-live="polite">讀取中...</output>
          </li>
          <li>
            <strong>Bearer Token</strong>
            <output id="mcp-token" aria-live="polite">尚未產生</output>
          </li>
        </ul>
        <button id="generate-token" type="button">產生 / 更新金鑰</button>
        <p class="member-message" id="member-message" role="status" aria-live="polite"></p>
      </section>

      <hr />
      <button class="member-logout" id="member-logout" type="button">登出會員</button>
    </main>

    <div class="member-delete-dialog" id="member-delete-dialog" hidden>
      <section class="member-delete-dialog__panel" role="dialog" aria-modal="true" aria-labelledby="member-delete-title" aria-describedby="member-delete-description">
        <h2 id="member-delete-title">刪除行程紀錄</h2>
        <p id="member-delete-description">確定要刪除這筆已完成的行程紀錄嗎？刪除後將無法復原。</p>
        <p class="member-delete-dialog__order" id="member-delete-order"></p>
        <p class="member-delete-dialog__message" id="member-delete-message" role="alert"></p>
        <div class="member-delete-dialog__actions">
          <button class="member-delete-dialog__cancel" id="member-delete-cancel" type="button">取消</button>
          <button class="member-delete-dialog__confirm" id="member-delete-confirm" type="button">確認刪除</button>
        </div>
      </section>
    </div>

    <footer class="site-footer">COPYRIGHT © 2021 台北一日遊</footer>
  </body>
</html>
