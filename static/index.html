<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="台北一日遊景點搜尋" />
    <title>台北一日遊</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/css/style.css?v=1.3.98" />
    <script src="/static/js/app.js?v=1.1.2" defer></script>
  </head>
  <body>
    <header class="site-header">
      <nav class="navigation" aria-label="主要導覽">
        <a class="brand" href="/">台北一日遊</a>
        <div class="navigation__links">
          <a href="/booking">預定行程</a>
          <button class="navigation__member" type="button">登入/註冊</button>
        </div>
      </nav>
    </header>

    <main>
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero__content">
          <h1 id="hero-title">輕鬆享受台北一日悠閒</h1>
          <p>探索每個角落，體驗城市的深度旅遊行程</p>

          <form class="search" id="search-form" role="search">
            <div class="category">
              <button
                class="category__button"
                id="category-button"
                type="button"
                aria-expanded="false"
                aria-controls="category-menu"
              >
                <span id="current-category">全部分類</span>
                <span class="category__caret" aria-hidden="true">▼</span>
              </button>
              <div class="category__menu" id="category-menu" role="listbox" hidden></div>
            </div>
            <label class="sr-only" for="keyword">輸入景點名稱查詢</label>
            <input
              id="keyword"
              name="keyword"
              type="search"
              placeholder="輸入景點名稱查詢"
              autocomplete="off"
            />
            <button class="search__submit" type="submit" aria-label="搜尋">
              <img src="/static/images/icon_search.png" alt="" />
            </button>
          </form>
        </div>
      </section>

      <section class="explore" aria-label="探索景點">
        <div class="mrt-bar">
          <button class="mrt-bar__arrow" id="mrt-left" type="button" aria-label="向左瀏覽捷運站">
            <img src="/static/images/arrow_left_default.png?v=week10" alt="" />
          </button>
          <div class="mrt-bar__list" id="mrt-list" tabindex="0" aria-label="捷運站列表"></div>
          <button class="mrt-bar__arrow" id="mrt-right" type="button" aria-label="向右瀏覽捷運站">
            <img src="/static/images/arrow_left_default.png?v=week10" alt="" />
          </button>
        </div>

        <div class="attractions" id="attractions" aria-live="polite"></div>
        <p class="status" id="status" role="status"></p>
        <div class="load-sentinel" id="load-sentinel" aria-hidden="true"></div>
      </section>
    </main>

    <footer class="site-footer">COPYRIGHT © 2021 台北一日遊</footer>
  </body>
</html>
