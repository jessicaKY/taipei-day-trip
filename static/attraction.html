<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="台北一日遊景點與導覽行程" />
    <title>景點介紹｜台北一日遊</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/css/attraction.css?v=1.0.22" />
    <link rel="stylesheet" href="/static/css/navigation.css?v=1.0.5" />
    <script src="/static/js/attraction.js?v=1.0.0" defer></script>
  </head>
  <body>
    <header class="site-header">
      <nav class="navigation" aria-label="主要導覽">
        <a class="brand" href="/">台北一日遊</a>
        <div class="navigation__links">
          <a href="/booking">預定行程</a>
          <button class="navigation__member" type="button">登入/註冊</button>
        </div>
      </nav>
    </header>
    <main>
      <section class="attraction-hero" aria-live="polite">
        <div class="slideshow" id="slideshow" aria-label="景點圖片輪播">
          <img class="slideshow__image" id="attraction-image" src="" alt="" />
          <button class="slideshow__arrow slideshow__arrow--left" id="previous-image" type="button" aria-label="上一張圖片">
            <img src="/static/images/attraction_arrow_left.png?v=1" alt="" />
          </button>
          <button class="slideshow__arrow slideshow__arrow--right" id="next-image" type="button" aria-label="下一張圖片">
            <img src="/static/images/attraction_arrow_right.png?v=1" alt="" />
          </button>
          <div class="slideshow__indicators" id="image-indicators" aria-hidden="true"></div>
        </div>
        <div class="profile">
          <h1 id="attraction-name">景點載入中</h1>
          <p class="profile__summary" id="attraction-summary"></p>
          <form class="booking-form" id="booking-form">
            <h2>訂購導覽行程</h2>
            <p>以此景點為中心的一日行程，帶您探索城市角落故事</p>
            <div class="booking-field booking-field--date">
              <label for="tour-date">選擇日期：</label>
              <div class="date-control">
                <input id="tour-date" name="date" type="date" required />
                <span class="date-control__placeholder" aria-hidden="true">yyyy/mm/dd</span>
              </div>
            </div>
            <fieldset class="booking-field booking-field--time">
              <legend>選擇時間：</legend>
              <label><input type="radio" name="time" value="morning" checked />上半天</label>
              <label><input type="radio" name="time" value="afternoon" />下半天</label>
            </fieldset>
            <div class="booking-field booking-field--price">
              <span class="booking-field__label">導覽費用：</span>
              <span id="tour-price">新台幣 2000 元</span>
            </div>
            <button class="booking-form__submit" type="submit">開始預約行程</button>
          </form>
        </div>
      </section>
      <section class="attraction-details" aria-label="景點資訊">
        <p class="attraction-details__description" id="attraction-description"></p>
        <h2>景點地址：</h2>
        <p id="attraction-address"></p>
        <h2>交通方式：</h2>
        <p id="attraction-transport"></p>
      </section>
      <p class="page-status" id="page-status" role="status"></p>
    </main>
    <footer class="site-footer">COPYRIGHT © 2021 台北一日遊</footer>
  </body>
</html>
